apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP}-${SLOT}
  namespace: devops-assignment
spec:
  replicas: ${REPLICAS}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ${APP}
      slot: ${SLOT}
  template:
    metadata:
      labels:
        app: ${APP}
        slot: ${SLOT}
    spec:
      containers:
        - name: web
          image: ${IMAGE}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: ${HEALTH_PATH}
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP}-${SLOT}-preview
  namespace: devops-assignment
spec:
  selector:
    app: ${APP}
    slot: ${SLOT}
  ports:
    - port: 80
      targetPort: 80
